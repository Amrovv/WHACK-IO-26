# All thresholds live here, never as magic numbers in code.
# Starting values only; tune them on footage. Structure owned by B (change by PR + team chat).
# Durations are seconds unless the key ends in _ms.

perception:
  pose_model: models/pose_landmarker_full.task
  max_width: 640            # downscale before pose
  contact_margin: 0.2       # x arm length, around each hold box
  contact_settle_ms: 150
  contact_release_ratio: 1.6   # release box = margin x this (hysteresis)
  contact_dip_frames: 3        # keep a contact through a visibility dip this short
  contact_still_speed: 0.4     # limb is 'still' below this speed (normalised units per second)
  min_visibility: 0.4          # landmarks below this give no contact and freeze the limb point
  resume_visibility: 0.7       # a frozen limb follows the pose again only above this...
  resume_frames: 3             # ...for this many frames in a row (one bad frame must not unfreeze it)
  hold_lookback_frames: 8      # a freezing limb returns to its position this many frames earlier
  lost_memory_frames: 45       # a brief person-lost gap (<= this many frames) keeps limb and contact memory
  arm_length_frames: 60        # frames of history for the median arm length
  arm_length_default: 0.25     # arm length (normalised) until real samples exist
  # Added by A for pose (B owns this structure: confirm in PR).
  num_poses: 2              # detect up to 2 people, keep the largest
  lr_swap_frames: 5         # frames a new left/right order must hold before relabelling
  lr_min_x_gap: 0.03        # below this x gap between sides, x order is noise: keep labels
  one_euro:                 # limb-point smoothing
    min_cutoff: 1.0
    beta: 0.05
    d_cutoff: 1.0

holds:
  detector_model: hold-detector-rnvkl/1  # Roboflow model id (Climb AI hold detector; picked in experiment 2)
  hue_tolerance: 12         # OpenCV hue units, 0-179
  min_saturation: 60
  white_min_value: 210       # white holds must be bright enough to separate from the beige/grey wall
  white_max_saturation: 55   # and nearly neutral; excludes red/teal holds
  white_min_fraction: 0.15   # share of a detection's pixels that must be white (real white holds 0.18-0.66, others <= 0.10)
  # Added by A for the hold map (B owns this structure: confirm in PR).
  api_url: https://serverless.roboflow.com
  polygon_epsilon: 0.02     # detector outlines are simplified to this fraction of their perimeter (fewer, editable corners)
  patch_radius_px: 12       # half-size; wider patch avoids a hand/shadow dominating a hold click
  morph_kernel_px: 5        # open/close kernel for colour-only mode
  min_area: 0.0003          # colour-only blob area limits, fraction of the image area
  max_area: 0.02
  split_peak_ratio: 0.75    # watershed seeds for splitting touching holds: fraction of the blob's max thickness
  drag_min_px: 6            # editor: a mouse move shorter than this is a click, longer draws a box
  start_count: 2            # lowest N holds are marked start

brain:
  debounce_ms: 400
  stall_s: [4, 7, 10]       # escalating stall cues
  arms_bent_deg: 140
  feet_low_ratio: 0.9       # hip-to-lowest-foot height / leg length
  search_ms: 400
  route_preview_ratio: 0.8  # hold gap / arm span
  weight_shift_ratio: 0.25  # sideways hip-to-foot gap / leg length
  on_wall_margin: 0.15      # hip rise above standing height / leg length

  # Features + attempts (B3)
  move_speed_eps: 0.02      # normalised units/s; below this a limb/hip counts as static
  on_wall_settle_s: 0.5     # hip must stay raised this long to confirm ON_WALL
  top_hold_s: 1.0           # both hands on the top hold this long = top
  fall_speed: 0.6           # downward hip velocity (norm units/s) above this = falling
  ground_settle_s: 1.0      # back on the ground this long before the attempt is closed

  # Detectors (B4)
  cue_mute_after_fall_s: 1.0        # suppress all cue detectors this long after a fall
  cue_mute_hip_speed: 0.6           # suppress cue detectors while hip speed exceeds this
  next_hold_distance_penalty: 0.5   # weight on distance when scoring HandSearching's next hold

  # Good-tier detectors (B6)
  quiet_feet_window_s: 1.0          # foot leaves and re-touches the same hold within this = fidgety
  feet_cut_ms: 300                  # both feet off while both hands on, longer than this = feet cut

  # Memory + compliance (B5)
  compliance_window_s: 3.0          # watch this long after a cue for the expected change
  compliance_progress_s: 5.0        # a followed cue + new higher hold within this = told_you_so
  arms_bent_comply_margin_deg: 10   # elbows must exceed arms_bent_deg + this to count as complied
  feet_low_comply_rise_ratio: 0.3   # lowest foot must rise this * leg_length to count as complied
  mood_impressed_rate: 0.6          # compliance rate over last 2 attempts above this = impressed
  mood_exasperated_attempts: 3      # same habit firing in this many attempts = exasperated

  priorities:               # event kind -> arbiter priority (0 big moment, 1 cue, 2 banter)
    attempt_start: 0         # interrupts a running debrief (arbiter.py) instead of queuing behind it
    hand_searching: 1
    feet_low: 1
    arms_bent: 1
    stalling: 1
    fall: 0
    top: 0
    high_point: 1
    quiet_feet: 1
    feet_cut: 1
    weight_shift: 1
    crux_warning: 1
    route_preview: 2
    told_you_so: 2

arbiter:
  global_gap_s: 3
  cooldown_s: 15
  budget_lines: 6
  budget_window_s: 30
  ttl_s: {p0: 2.0, p1: 1.2, p2: 4.0}

voice:
  persona: config/personas/coach.yaml
  tts: kokoro
  output_device: null       # set to the demo speaker's name
  llm_model: gemini-3.5-flash-lite
  debrief_first_sentence_timeout_s: 4
