<!doctype html>
<!--
  Climbing Coach live dashboard. Plain HTML/CSS/JS, no build step.
  Built to be read from 3 m away on a laptop screen. Fonts are served from web/fonts/ (no internet needed).

  Video: <img src="/video"> (MJPEG or any image stream), or JPEG frames over the WebSocket:
         binary messages, or {"topic": "frame", "data": "<base64 jpeg>"}. The first WebSocket
         frame switches the page to WebSocket video. ?video=ws skips /video entirely.
         Test with: python web/stream_test.py --source <clip.mp4 | 0 for webcam>
  Data:  WebSocket ws://<host>/ws, one JSON message per bus item:
           {"topic": "<topic>", "data": <payload>}
         Also accepted: {"type": ..., "payload": ...} and mixes of those keys.
  Topics (payloads = dataclasses in coach/contracts.py, via dataclasses.asdict):
    holdmap       HoldMap
    state         ClimberState
    event         CoachEvent
    suppressed    Suppressed
    attempt       AttemptSummary
    spoken        SpokenLine
    debrief_text  str  (or {"text": str})
  Extra, optional (not bus topics, for the server to send if it can):
    mood          "neutral" | "impressed" | "exasperated"  (or {"mood": ...})
    hello         {"no_llm": bool, "persona": str, "mood": str, "problem_id": str,
                   "mode": "live" | "offline" | "video_test" | "session_replay",
                   "source": {"kind": "camera", "index": int}
                           | {"kind": "browser_camera"}
                           | {"kind": "file", "name": str, "frames": int, "fps": float,
                              "width": int, "height": int}
                           | {"kind": "poses" | "bus_log", "name": str},
                   "session": int, "spec": str}
                  mode drives the head flag and layout: video_test shows the video only,
                  offline shows clip progress (from each state's frame_idx and source.frames).
                  A new session number means the source changed: the page starts afresh.
  Source picker: GET /api/sources lists what the server can analyse, POST /api/source
         {"spec"} switches. Picking "This device's camera" sends webcam JPEGs to WS /camera;
         the server analyses them and the page shows its frames like any other source.
         Without those endpoints (replay server, stream_test.py) the picker stays hidden.
  Portrait video: the stage shrinks to the picture's width and the side column takes the rest.
  Any payload with a "mood" field also updates the mood shown beside the caption.

  URL params: ?demo=1 fake data, no server needed.  ?offline=1 force the offline flag.
              ?ws=<url> override the WebSocket url.   ?video=<url> override the video url.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Climbing Coach</title>
<style>
  @font-face {
    font-family: "Atkinson Hyperlegible Next";
    src: url("/fonts/atkinson-hyperlegible-next-latin.woff2") format("woff2");
    font-weight: 400 800; font-display: swap;
  }
  @font-face {
    font-family: "Atkinson Hyperlegible Mono";
    src: url("/fonts/atkinson-hyperlegible-mono-latin.woff2") format("woff2");
    font-weight: 500 800; font-display: swap;
  }

  :root {
    /* The logbook, after dark: graphite page, light pencil ink, field-book yellow for the coach's voice,
       red pen for sends. The problem's own hold colour (set from the hold map) marks the live hold. */
    color-scheme: dark;
    --page: #16181b;
    --page-2: #202327;
    --ink: #eef0ea;
    --graphite: #b4bac1;
    --pencil: #8c939a;
    --rule: #33383e;
    --rule-strong: #565c63;
    --cover: #f2c230;
    --cover-ink: #2a2306;
    --red: #ff5a6e;
    --signal: #7cc4ff;   /* "Analysing in real time": the coach is watching a clip. Used nowhere else. */
    --hold: #eef0ea;
    --hold-ink: #16181b;
    --frame: #0b0c0d;
    /* Limb colours, used only on the video overlay. */
    --lh: #4fc3f7;
    --rh: #b388ff;
    --lf: #9ccc65;
    --rf: #e0e0e0;

    /* One three-step size ramp, tuned for reading at 3 m. */
    --s: clamp(16px, min(1.45vw, 2.35vh), 24px);
    --m: clamp(24px, min(2.6vw, 4.2vh), 44px);
    --l: clamp(72px, min(5.6vw, 9vh), 96px);

    --rule-w: 3px;
    --gap: clamp(12px, 1.4vw, 24px);
    --head-h: clamp(56px, 8.8vh, 88px);
    --cap-h: clamp(165px, 21vh, 220px);
    --ladder-w: clamp(150px, 13vw, 230px);
    --side-w: clamp(260px, 25vw, 420px);

    --sans: "Atkinson Hyperlegible Next", system-ui, sans-serif;
    --mono: "Atkinson Hyperlegible Mono", ui-monospace, monospace;
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); font-family: var(--sans); }
  body {
    display: grid; overflow: hidden;
    grid-template-columns: minmax(0, 1fr) var(--ladder-w) var(--side-w);
    grid-template-rows: var(--head-h) minmax(0, 1fr) auto var(--cap-h);
    grid-template-areas: "head head head" "stage ladder side" "src ladder side" "cap cap cap";
  }
  ::selection { background: var(--cover); color: var(--cover-ink); }
  * { scrollbar-width: thin; scrollbar-color: var(--pencil) transparent; }
  .num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
  [hidden] { display: none !important; }

  /* ---- Running head: where we are, like a book's guide words ---- */
  #head { grid-area: head; display: flex; align-items: center; gap: var(--gap);
    padding: 0 calc(var(--gap) * 1.4); border-bottom: var(--rule-w) solid var(--rule-strong); min-width: 0; }
  #where { font-size: var(--m); font-weight: 800; letter-spacing: -0.01em; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #where .sep { color: var(--pencil); font-weight: 400; margin: 0 0.3em; }
  #where .live-hold { display: inline-block; min-width: 1.5em; padding: 0 0.2em; text-align: center;
    background: var(--hold); color: var(--hold-ink); }
  #flags { margin-left: auto; display: flex; gap: calc(var(--gap) * 0.6); align-items: center; flex: none; }
  .flag { font-size: var(--s); font-weight: 600; color: var(--graphite); white-space: nowrap;
    display: inline-flex; align-items: center; gap: 0.45em; }
  .flag.boxed { border: 2px solid var(--ink); color: var(--ink); padding: 0.1em 0.5em; }
  .dot { width: 0.7em; height: 0.7em; border-radius: 50%; border: 2px solid currentColor; flex: none; }
  /* Mode: red flashing for a live camera only; real-time analysis of a clip stays ink. */
  #mode.live { color: var(--red); }
  #mode.live .dot { background: var(--red); border-color: var(--red); animation: live-blink 1.4s ease-in-out infinite; }
  @keyframes live-blink { 50% { opacity: 0.2; } }
  #mode.realtime { color: var(--signal); font-weight: 700; }
  #mode.realtime .dot { background: var(--signal); border-color: var(--signal); }
  #mode.boxed .dot { display: none; }
  #conn.down { color: var(--ink); }
  #stream-stats { color: var(--graphite); }

  /* ---- Video ---- */
  #stage { grid-area: stage; position: relative; min-height: 0; min-width: 0;
    display: flex; align-items: center; justify-content: flex-start;
    padding: var(--gap) var(--gap) var(--gap) calc(var(--gap) * 1.4); }
  /* #frame is sized by JS to the video's aspect ratio, so the picture fills it with nothing clipped. */
  #frame { position: relative; flex: none; width: 100%; height: 100%; background: var(--frame); overflow: hidden; outline: 2px solid var(--rule); }
  #video, #overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #video { object-fit: fill; }
  #video:not([src]) { visibility: hidden; }
  #novideo { position: absolute; left: 0.8em; right: 0.8em; bottom: 0.6em; color: #c9ced3; font-size: var(--s); font-weight: 600; }
  #novideo small { font-weight: 400; color: #9aa1a7; margin-left: 0.4em; }

  /* Clip progress: a thin bar along the bottom of the video. Its words live in the source bar, outside the picture. */
  #clip-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(238, 240, 234, 0.18); pointer-events: none; }
  #clip-bar span { display: block; height: 100%; width: 0; background: var(--ink); }

  /* Source bar: what's being analysed and the picker to change it. Its own grid row: under a landscape
     picture, across the top of the data beside a portrait one. */
  #srcbar { grid-area: src; display: flex; flex-wrap: wrap; align-items: center; gap: 0.35em var(--gap);
    min-width: 0; font-size: var(--s); padding: 0 0 var(--gap) calc(var(--gap) * 1.4); }
  #src-pick { display: inline-flex; align-items: center; gap: 0.55em; min-width: 0; max-width: 100%;
    color: var(--graphite); font-weight: 600; }
  .sel { position: relative; display: inline-flex; min-width: 0; max-width: 100%; }
  .sel::after { content: ""; position: absolute; right: 0.75em; top: 50%; width: 0.42em; height: 0.42em;
    border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); transform: translateY(-70%) rotate(45deg);
    pointer-events: none; }
  #source { appearance: none; -webkit-appearance: none; font: inherit; font-weight: 700; color: var(--ink);
    background: var(--page-2); border: 2px solid var(--rule-strong); border-radius: 0; padding: 0.2em 2.1em 0.2em 0.55em;
    min-width: 0; max-width: min(34em, 100%); text-overflow: ellipsis; cursor: pointer; transition: border-color 0.15s; }
  #source:hover { border-color: var(--ink); }
  #source:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  #source:disabled { cursor: progress; color: var(--graphite); }
  #source option, #source optgroup { background: var(--page-2); color: var(--ink); }
  #clip-label { color: var(--graphite); font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  #clip-label .name { color: var(--ink); }
  #clip-label .sep { color: var(--pencil); margin: 0 0.3em; font-weight: 400; }
  #src-note { color: var(--ink); font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
  #src-note.err { border: 2px solid var(--ink); padding: 0.1em 0.5em; }

  /* Portrait video: the picture runs the full height on the left. To its right, top to bottom: the source
     bar, then the hold ladder as its own column beside the coach data (latency and attempts, then the
     timeline), then the caption band. */
  body.portrait {
    grid-template-columns: auto var(--ladder-w) minmax(0, 1fr);
    grid-template-rows: var(--head-h) auto minmax(0, 1fr) var(--cap-h);
    grid-template-areas: "head head head" "stage src src" "stage ladder side" "stage cap cap";
  }
  body.portrait #stage { justify-content: center; }
  body.portrait #srcbar { padding: calc(var(--gap) * 0.65) calc(var(--gap) * 1.2);
    border-left: var(--rule-w) solid var(--rule-strong); border-bottom: 2px solid var(--rule); }
  body.portrait #side { min-width: calc(var(--side-w) * 1.5);
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); grid-template-rows: auto minmax(0, 1fr); }
  body.portrait #side > .sect:nth-child(1) { grid-column: 1; grid-row: 1; }
  body.portrait #side > .sect:nth-child(2) { grid-column: 1; grid-row: 2; border-bottom: 0; }
  body.portrait #timeline-sect { grid-column: 2; grid-row: 1 / span 2; border-left: 2px solid var(--rule); }

  /* Video test: there's no coach data, so the video gets the whole screen. */
  body[data-mode="video_test"] { grid-template-columns: minmax(0, 1fr); grid-template-rows: var(--head-h) minmax(0, 1fr) auto;
    grid-template-areas: "head" "stage" "src"; }
  body[data-mode="video_test"] #ladder-col, body[data-mode="video_test"] #side,
  body[data-mode="video_test"] #caption { display: none; }
  body[data-mode="video_test"] #stage { padding-right: calc(var(--gap) * 1.4); }

  /* ---- Hold ladder: the problem, top hold at the top; each attempt ticked at its highpoint ---- */
  /* Its own ruled, titled column, separate from the picture in every layout. */
  #ladder-col { grid-area: ladder; min-width: 0; min-height: 0; display: flex; flex-direction: column;
    border-left: var(--rule-w) solid var(--rule-strong);
    padding: calc(var(--gap) * 0.65) var(--gap); }
  #ladder { flex: 1; min-width: 0; display: grid; grid-template-rows: repeat(var(--n, 1), minmax(0, 1fr)); min-height: 0; }
  #ladder:empty::after { content: "No hold map yet"; align-self: center; justify-self: stretch; color: var(--pencil);
    font-size: var(--s); text-align: center; }
  .rung { display: flex; align-items: center; gap: 0.35em; border-top: 2px solid var(--rule); min-height: 0; min-width: 0;
    overflow: hidden; font-size: var(--rung-fs, var(--m)); }
  .rung:last-child { border-bottom: 2px solid var(--rule); }
  .rung .n { flex: none; width: 1.65em; text-align: center; font-family: var(--mono); font-weight: 700;
    color: var(--pencil); line-height: 1.15; }
  .rung.high .n { color: var(--ink); box-shadow: inset 0 0 0 3px var(--ink); }
  .rung.now .n { color: var(--hold-ink); background: var(--hold); box-shadow: none; }
  .rung .marks { display: flex; align-items: center; gap: 0.15em; min-width: 0; overflow: hidden; }
  .mark { display: inline-flex; align-items: center; height: 0.95em; }
  .mark svg { height: 100%; width: auto; overflow: visible; }
  .mark path { fill: none; stroke: var(--graphite); stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .mark.top path { stroke: var(--red); stroke-width: 3.6; }
  .mark .a { font-family: var(--mono); font-size: 0.7em; font-weight: 700; color: var(--graphite); margin-left: 0.1em; }
  .mark.top .a { color: var(--red); }
  .mark.fresh path { stroke-dasharray: 40; stroke-dashoffset: 40; animation: pencil 0.7s var(--ease-out) 0.15s forwards; }
  @keyframes pencil { to { stroke-dashoffset: 0; } }

  /* ---- Side column: ruled, not carded ---- */
  #side { grid-area: side; border-left: var(--rule-w) solid var(--rule-strong);
    display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .sect { padding: calc(var(--gap) * 0.65) calc(var(--gap) * 1.2); border-bottom: 2px solid var(--rule); }
  .sect h2, #ladder-head { margin: 0 0 0.35em; font-size: var(--s); font-weight: 700; color: var(--graphite);
    display: flex; align-items: baseline; gap: 0.5em; }
  .sect h2 .aside, #ladder-head .aside { margin-left: auto; font-weight: 400; color: var(--pencil); }

  #lat-row { display: flex; align-items: flex-end; gap: var(--gap); }
  #lat-last { font-size: var(--l); font-weight: 700; line-height: 0.95; white-space: nowrap; }
  #lat-last small, .unit { font-size: var(--s); font-weight: 500; color: var(--graphite); margin-left: 0.2em; }
  #lat-last.late { background: var(--ink); color: var(--page); padding: 0 0.12em; }
  #lat-last.late small { color: var(--page); }
  #lat-hist { flex: 1; height: calc(var(--l) * 0.9); min-width: 0; display: block; }
  #lat-hist .bar { fill: var(--graphite); }
  #lat-hist .bar.late { fill: var(--ink); }
  #lat-hist .target { stroke: var(--ink); stroke-width: 1.5; stroke-dasharray: 4 3; }
  #lat-sub { font-size: var(--s); color: var(--graphite); margin-top: 0.35em; }
  #lat-sub b { color: var(--ink); }


  #attempts { display: flex; flex-direction: column; }
  #attempts:empty::after { content: "No attempts yet"; color: var(--pencil); font-size: var(--s); }
  .att { padding: 0.25em 0; border-top: 1px solid var(--rule); font-size: var(--s); min-width: 0; }
  .att:first-child { border-top: 0; padding-top: 0; }
  .att .row { display: flex; align-items: center; gap: 0.45em; min-width: 0; }
  .att .mark { font-size: var(--m); }

  .att .o { font-size: var(--m); font-weight: 800; line-height: 1.1; white-space: nowrap; }
  .att.top .o { color: var(--red); }
  .att .d { color: var(--graphite); }
  .att .d b { color: var(--ink); font-family: var(--mono); }
  .att.live .o { color: var(--ink); }
  .att.live .mark .a { color: var(--ink); }
  #attempts-more { font-size: var(--s); color: var(--pencil); margin-top: 0.4em; }

  #timeline-sect { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 0; }
  #timeline { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0; list-style: none; font-size: var(--s); }
  #timeline.overflowing {
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 1.6em), transparent);
    mask-image: linear-gradient(to bottom, #000 calc(100% - 1.6em), transparent); }
  #timeline li { padding: 0.25em 0; border-bottom: 1px solid var(--rule); line-height: 1.2; display: flex; gap: 0.6em; align-items: baseline; }
  #timeline .txt { flex: 1; min-width: 0; }
  #timeline .meta { flex: none; font-size: 0.8em; color: var(--pencil); font-family: var(--mono); }
  #timeline li.spoken .txt { font-weight: 700; }
  #timeline li.suppressed { color: var(--pencil); }
  #timeline li.suppressed .txt { text-decoration: line-through; text-decoration-thickness: 1.5px; }
  #timeline li.attempt .txt { font-weight: 700; color: var(--ink); }
  #timeline li.attempt.top .txt { color: var(--red); }
  #timeline li.debrief .txt { font-style: italic; color: var(--graphite); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #timeline.hide-suppressed li.suppressed { display: none; }
  #timeline:empty::after { content: "Waiting for the coach…"; color: var(--pencil); }
  /* Checkbox: a ruled square with the ladder's pencil tick, drawn in when checked.
     The real input sits invisibly on top, so clicks, keyboard and screen readers still work. */
  label.toggle { margin-left: auto; font-weight: 400; color: var(--graphite); display: inline-flex;
    align-items: center; align-self: center; gap: 0.5em; cursor: pointer; user-select: none;
    transition: color 0.15s; }
  label.toggle:hover { color: var(--ink); }
  .box { position: relative; flex: none; width: 1.3em; height: 1.3em; border: 2px solid var(--pencil);
    transition: border-color 0.15s; }
  .box input { position: absolute; inset: -2px; width: calc(100% + 4px); height: calc(100% + 4px);
    margin: 0; opacity: 0; cursor: pointer; }
  .box svg { position: absolute; inset: 12%; width: 76%; height: 76%; overflow: visible; pointer-events: none; }
  .box path { fill: none; stroke: var(--ink); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 32; stroke-dashoffset: 32; transition: stroke-dashoffset 0.12s ease-in; }
  label.toggle:hover .box, .box:has(input:checked) { border-color: var(--ink); }
  .box:has(input:checked) path { stroke-dashoffset: 0; transition: stroke-dashoffset 0.38s var(--ease-out) 0.04s; }
  .box:has(input:focus-visible) { outline: 3px solid var(--ink); outline-offset: 3px; }

  /* ---- Caption: the coach's voice, the one yellow thing on screen ---- */
  #caption { grid-area: cap; background: var(--cover); color: var(--cover-ink);
    display: flex; align-items: center; gap: calc(var(--gap) * 1.4); padding: 0 calc(var(--gap) * 1.8); min-width: 0; overflow: hidden; }
  #cap-who { flex: none; display: flex; flex-direction: column; align-items: flex-start; gap: 0.3em; font-size: var(--s); }
  #cap-who .who { font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; border: var(--rule-w) solid var(--cover-ink);
    padding: 0.15em 0.5em; }
  #cap-who .mood { font-weight: 600; }
  #cap-text { flex: 1; min-width: 0; font-size: var(--l); font-weight: 800; line-height: 1.05; letter-spacing: -0.015em;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-wrap: balance; }
  #cap-ms { flex: none; font-size: var(--m); font-weight: 700; white-space: nowrap; }
  body.debriefing { --cap-h: clamp(165px, 34vh, 340px); }
  #caption.debrief #cap-text { font-size: var(--m); font-weight: 600; line-height: 1.2; letter-spacing: 0;
    -webkit-line-clamp: 5; text-wrap: pretty; }
  #caption.debrief.long #cap-text { font-size: calc(var(--m) * 0.8); -webkit-line-clamp: 7; }
  /* A cue too long for two lines at full size (the band is narrower beside a portrait picture) steps down once. */
  #caption.fit:not(.debrief) #cap-text { font-size: calc(var(--l) * 0.78); }
  #caption.idle #cap-text, #caption.idle #cap-ms { color: rgba(42, 35, 6, 0.62); }
  #caption.waiting #cap-text { font-size: var(--m); font-weight: 600; color: rgba(42, 35, 6, 0.7); }
  #cap-text.arrive { animation: arrive 0.45s var(--ease-out); }
  @keyframes arrive { from { opacity: 0.35; transform: translateY(0.18em); } }

  @media (prefers-reduced-motion: reduce) {
    #source { transition: none; }
    #cap-text.arrive, .mark.fresh path, #mode.live .dot { animation: none; stroke-dashoffset: 0; }
    .box path, .box:has(input:checked) path { transition: none; }
  }

  /* Narrow screens: stack everything and scroll; the ladder runs left (1) to right (top). */
  @media (max-width: 900px) {
    :root { --s: 16px; --m: 24px; --l: 36px; }
    html, body { height: auto; }
    body { overflow: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto;
      grid-template-areas: "head" "cap" "stage" "src" "ladder" "side"; }
    #srcbar { padding: 0 16px 12px; }
    #head { flex-wrap: wrap; padding: 12px 16px; }
    #flags { margin-left: 0; flex: 1 1 100%; flex-wrap: wrap; }
    #where { white-space: normal; }
    #stage { height: auto; padding: 12px 16px; }
    #ladder { grid-template-rows: auto; grid-template-columns: repeat(var(--n, 1), minmax(0, 1fr)); grid-auto-flow: column;
      direction: rtl; }
    #ladder-col { border-left: 0; border-top: var(--rule-w) solid var(--rule-strong); padding: 12px 16px; }
    .rung { direction: ltr; flex-direction: column; border-top: 0; border-left: 2px solid var(--rule); --rung-fs: 22px; }
    .rung:last-child { border-bottom: 0; }
    #side { border-left: 0; border-top: var(--rule-w) solid var(--rule-strong); margin-left: 0; }
    #timeline { max-height: 60vh; }
    #caption { padding: 14px 16px; flex-wrap: wrap; gap: 10px 16px; }
    #caption.fit:not(.debrief) #cap-text { -webkit-line-clamp: 3; }
  }
</style>
</head>
<body>
<header id="head">
  <div id="where">Waiting for the first attempt</div>
  <div id="flags">
    <span id="problem" class="flag" hidden></span>
    <span id="holds-mode" class="flag boxed" hidden>Colour-only holds</span>
    <span id="offline" class="flag boxed" hidden>Offline: no LLM</span>
    <span id="stream-stats" class="flag num" hidden></span>
    <span id="mode" class="flag" hidden><span class="dot"></span><span class="label"></span></span>
    <span id="conn" class="flag down"><span class="dot"></span><span class="label">Disconnected</span></span>
  </div>
</header>

<section id="stage" aria-label="Camera">
  <div id="frame">
    <div id="novideo">No video<small>waiting for the camera stream</small></div>
    <img id="video" alt="Live camera view of the climber">
    <canvas id="overlay"></canvas>
    <div id="clip-bar" hidden><span></span></div>
  </div>
</section>

<div id="srcbar" hidden>
  <label id="src-pick" hidden><span>Source</span><span class="sel"><select id="source"></select></span></label>
  <div id="clip-label" hidden></div>
  <div id="src-note" hidden></div>
</div>

<section id="ladder-col" aria-label="Holds, top to bottom, with each attempt's highpoint">
  <h2 id="ladder-head">Holds <span class="aside num" id="ladder-count"></span></h2>
  <div id="ladder"></div>
</section>

<aside id="side">
  <div class="sect">
    <h2>Cue latency <span class="aside">target <span class="num" id="lat-target"></span> ms</span></h2>
    <div id="lat-row">
      <div id="lat-last" class="num">–</div>
      <svg id="lat-hist" preserveAspectRatio="none" aria-hidden="true"></svg>
    </div>
    <div id="lat-sub">No cues spoken yet</div>
  </div>

  <div class="sect">
    <h2>Attempts</h2>
    <div id="attempts"></div>
    <div id="attempts-more" hidden></div>
  </div>

  <div class="sect" id="timeline-sect">
    <h2>Timeline <label class="toggle"><span class="box"><input type="checkbox" id="hide-supp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 13 L9 20 L21 4"/></svg></span>Hide suppressed</label></h2>
    <ul id="timeline"></ul>
  </div>
</aside>

<section id="caption" class="waiting" aria-live="polite">
  <div id="cap-who"><span class="who">Coach</span><span class="mood" id="mood" hidden></span></div>
  <div id="cap-text">The coach will speak here.</div>
  <div id="cap-ms" class="num"></div>
</section>

<script>
"use strict";

// ---- Settings ---------------------------------------------------------------
const CAPTION_FADE_MS = 4000;
const TIMELINE_MAX = 200;
const LATENCY_WINDOW = 50;          // cues used for the median
const LATENCY_HIST = 24;            // bars in the latency history
const LATENCY_WARN_MS = 800;        // target from CLAUDE.md
const RECONNECT_MAX_MS = 5000;
const STREAM_WINDOW = 30;           // frames averaged for the video-test fps and size
const DEBRIEF_LONG_CHARS = 240;    // longer debriefs step down a size
const HEAD_PAINT_MS = 250;          // running head refresh
const ATTEMPT_CELLS = 2;            // newest attempts shown as cells; all of them are on the ladder
const NARROW_MAX_VH = 0.7;          // narrow screens: the picture is at most this much of the screen height
const BROWSER_SPEC = "browser";     // the source spec for this device's camera (coach/server/camera.py)
const CAMERA_FPS = 15;              // webcam frames sent to the server per second
const CAMERA_MAX_SIDE = 960;        // longer side of a sent webcam frame, px
const CAMERA_JPEG_QUALITY = 0.8;
const CAMERA_MAX_BUFFER = 512 * 1024; // skip a frame while this much is still unsent
const CAMERA_RETRY_MS = 1000;
const CAMERA_BUSY_CODE = 4409;      // server: another dashboard is already sending
const CAMERA_KEY = "coach-camera";  // sessionStorage: this tab was sending its camera

const params = new URLSearchParams(location.search);
const WS_URL = params.get("ws") ||
  `${location.protocol === "https:" ? "wss" : "ws"}://${location.host || "localhost:8000"}/ws`;
const VIDEO_URL = params.get("video") || "/video";
const HTTP_BASE = WS_URL.replace(/^ws/, "http").replace(/\/ws(\?.*)?$/, "");
const CAMERA_URL = WS_URL.replace(/\/ws(\?.*)?$/, "/camera");
const DEMO = params.has("demo");

// Limb keys may arrive as enum values ("left_hand") or names ("LH").
const LIMB_ALIASES = { left_hand: "LH", right_hand: "RH", left_foot: "LF", right_foot: "RF",
                       LH: "LH", RH: "RH", LF: "LF", RF: "RF" };
const LIMB_COLOURS = { LH: css("--lh"), RH: css("--rh"), LF: css("--lf"), RF: css("--rf") };

// Hold-map colour names -> swatch for the live hold. Hex strings pass through.
const HOLD_COLOURS = { pink: "#e8458b", red: "#d93a3a", orange: "#f08a24", yellow: "#e8d44d", green: "#2fa35b",
  blue: "#3d7cf0", purple: "#9b5bd6", black: "#4a5057", white: "#ffffff", grey: "#8a9098", gray: "#8a9098",
  teal: "#14a3a3", brown: "#8a5a32" };

// Problem colours that would read as send red or the coach's yellow: the live hold uses the plain ink block instead.
const CLASHING_HOLD_COLOURS = new Set(["pink", "red", "orange", "yellow"]);

// MediaPipe pose landmark names, in index order (keypoints may be keyed by index).
const MP_NAMES = ["nose", "left_eye_inner", "left_eye", "left_eye_outer", "right_eye_inner", "right_eye",
  "right_eye_outer", "left_ear", "right_ear", "mouth_left", "mouth_right", "left_shoulder", "right_shoulder",
  "left_elbow", "right_elbow", "left_wrist", "right_wrist", "left_pinky", "right_pinky", "left_index",
  "right_index", "left_thumb", "right_thumb", "left_hip", "right_hip", "left_knee", "right_knee",
  "left_ankle", "right_ankle", "left_heel", "right_heel", "left_foot_index", "right_foot_index"];
const BONES = [
  ["left_shoulder", "right_shoulder"], ["left_hip", "right_hip"],
  ["left_shoulder", "left_hip"], ["right_shoulder", "right_hip"],
  ["left_shoulder", "left_elbow"], ["left_elbow", "left_wrist"],
  ["right_shoulder", "right_elbow"], ["right_elbow", "right_wrist"],
  ["left_hip", "left_knee"], ["left_knee", "left_ankle"], ["left_ankle", "left_heel"],
  ["left_heel", "left_foot_index"], ["left_ankle", "left_foot_index"],
  ["right_hip", "right_knee"], ["right_knee", "right_ankle"], ["right_ankle", "right_heel"],
  ["right_heel", "right_foot_index"], ["right_ankle", "right_foot_index"],
];
const MIN_VISIBILITY = 0.4;

// ---- State ------------------------------------------------------------------
const S = {
  mode: null,            // "live" | "offline" | "video_test" | "session_replay" | "demo", from hello
  session: null,         // hello.session; a new number means a new source
  source: null,          // hello.source
  stream: { arrivals: [], bytes: [] },  // video test: recent frame arrival times and sizes
  holdmap: null,
  state: null,
  latencies: [],
  spokenKeys: new Set(),  // cues that were actually said (capture time | kind)
  attemptNo: null,
  attemptStartT: null,   // state.t at attempt_start
  attemptLive: false,    // between attempt_start and its summary
  liveHold: null,        // highest hold a limb is on right now
  highHold: null,        // highest hold reached this attempt
  attempts: [],          // finished: { no, outcome, high }
  freshAttempt: null,    // attempt number whose tick should draw in
  lastOutcome: null,
  curEvents: 0,
  curSpoken: 0,
  debriefing: false,
  captionTimer: null,
  overlayDirty: true,
  headDirty: true,
};

const $ = (id) => document.getElementById(id);
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
function esc(s) { return String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function clock() { return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }); }
function holdCount() { return S.holdmap?.holds?.length || 0; }
const OUTCOME_WORDS = { top: "Top", fall: "Fall", downclimb: "Down-climb" };
function outcomeWord(o) { return OUTCOME_WORDS[o] || (o ? o[0].toUpperCase() + o.slice(1) : "?"); }

// ---- Message routing --------------------------------------------------------
function handle(msg) {
  const topic = msg.topic ?? msg.type;
  const data = msg.data ?? msg.payload;
  if (data && typeof data === "object" && typeof data.mood === "string") setMood(data.mood);
  switch (topic) {
    case "holdmap": onHoldmap(data); break;
    case "state": onState(data); break;
    case "frame": showBase64Frame(typeof data === "string" ? data : data?.jpeg); break;
    case "event": onEvent(data); break;
    case "suppressed": onSuppressed(data); break;
    case "attempt": onAttempt(data); break;
    case "spoken": onSpoken(data); break;
    case "debrief_text": onDebrief(typeof data === "string" ? data : data?.text); break;
    case "mood": setMood(typeof data === "string" ? data : data?.mood); break;
    case "hello": case "config": onHello(data || {}); break;
  }
}

function onHello(d) {
  if (d.session != null && S.session != null && d.session !== S.session) resetSession();
  if (d.session != null) S.session = d.session;
  $("offline").hidden = !(d.no_llm || d.offline || params.has("offline"));
  if (d.problem_id) showProblem(d.problem_id);
  if (d.mode) setMode(d.mode, d.source || null);
  if (d.spec) setCurrentSource(d.spec);
  syncCamera(d);
}

// A new source: forget the old problem, its attempts and cues, and wait for the new picture.
function resetSession() {
  Object.assign(S, { state: null, latencies: [], attemptNo: null, attemptStartT: null, attemptLive: false,
    liveHold: null, highHold: null, attempts: [], freshAttempt: null, lastOutcome: null, curEvents: 0,
    curSpoken: 0, debriefing: false, stream: { arrivals: [], bytes: [] }, overlayDirty: true, headDirty: true });
  S.spokenKeys.clear();
  onHoldmap(null);
  $("problem").hidden = true;
  const ul = $("timeline");
  ul.innerHTML = "";
  ul.classList.remove("overflowing");
  $("lat-last").textContent = "–";
  $("lat-last").classList.remove("late");
  $("lat-sub").textContent = "No cues spoken yet";
  $("lat-hist").innerHTML = "";
  setMood("neutral");
  clearTimeout(S.captionTimer);
  $("cap-text").textContent = "The coach will speak here.";
  $("cap-who").querySelector(".who").textContent = "Coach";
  $("cap-ms").textContent = "";
  $("caption").className = "waiting";
  document.body.classList.remove("debriefing");
  renderAttempts();
  // Drop the old picture so the layout follows the new one's shape from the first frame.
  video.removeAttribute("src");
  $("novideo").hidden = false;
  if (!wsVideo) loadVideo();
}

const MODE_FLAGS = {
  live: (src) => ["live", src?.kind === "browser_camera" ? "Live · browser camera"
    : src?.index != null ? `Live · camera ${src.index}` : "Live"],
  offline: () => ["realtime", "Analysing in real time"],
  video_test: () => ["boxed", "Video test"],
  session_replay: (src) => ["boxed", src?.name ? `Session replay · ${src.name}` : "Session replay"],
  demo: () => ["boxed", "Demo data"],
};

function setMode(mode, source) {
  S.mode = mode;
  S.source = source;
  document.body.dataset.mode = mode;
  const flag = $("mode"), make = MODE_FLAGS[mode];
  flag.hidden = !make;
  if (make) {
    const [cls, label] = make(source);
    flag.className = `flag ${cls}`;
    flag.querySelector(".label").textContent = label;
  }
  const clip = mode === "offline" && source?.kind === "file" && source.frames > 0;
  $("clip-bar").hidden = !clip;
  $("clip-label").hidden = !(mode === "offline" && source?.name);
  if (!$("clip-label").hidden) $("clip-label").innerHTML = clipName();
  $("stream-stats").hidden = mode !== "video_test";
  if (mode === "video_test" || mode === "session_replay") $("problem").hidden = true;
  const note = source?.kind === "browser_camera" ? (CAM.stream ? "starting the camera" : "waiting for the browser camera")
    : NO_VIDEO_NOTES[mode] || NO_VIDEO_NOTES.live;
  $("novideo").querySelector("small").textContent = note;
  renderSrcbar();
  S.headDirty = true;
  S.overlayDirty = true;
}

// The clip's name in the source bar, unless the picker already shows it.
function clipName() {
  const name = S.source?.name;
  return name && $("src-pick").hidden ? `<span class="name">${esc(name)}</span>` : "";
}

const NO_VIDEO_NOTES = {
  live: "waiting for the camera stream",
  offline: "waiting for the video",
  video_test: "waiting for frames",
  session_replay: "session replays carry coaching data only",
  demo: "demo data has no camera",
};

// Offline demo: where we are in the clip, from the frame index of the state being analysed.
function renderClip(frameIdx) {
  const src = S.source;
  if ($("clip-bar").hidden || !Number.isFinite(frameIdx)) return;
  const pos = frameIdx % src.frames, loop = Math.floor(frameIdx / src.frames) + 1;
  const fps = src.fps || 30, sep = `<span class="sep">·</span>`, name = clipName();
  $("clip-bar").firstElementChild.style.width = `${(100 * pos) / src.frames}%`;
  $("clip-label").innerHTML = `${name}${name ? sep : ""}<span class="num">${fmtTime(pos / fps)} / ${fmtTime(src.frames / fps)}</span>` +
    (loop > 1 ? `${sep}loop <span class="num">${loop}</span>` : "");
}

// Video test: frames per second and size, measured from what actually arrives.
function renderStreamStats() {
  if (S.mode !== "video_test") return;
  const { arrivals, bytes } = S.stream;
  const span = (arrivals.at(-1) - arrivals[0]) / 1000;
  const fps = arrivals.length > 1 && span > 0 ? ((arrivals.length - 1) / span).toFixed(1) : null;
  const kb = bytes.length ? Math.round(bytes.reduce((a, b) => a + b, 0) / bytes.length / 1024) : null;
  const size = video.naturalWidth ? `${video.naturalWidth}×${video.naturalHeight}` : "";
  const parts = wsVideo
    ? [fps && `${fps} fps`, kb != null && `${kb} KB/frame`, size, "WebSocket"]
    : [size, "MJPEG"];
  $("stream-stats").textContent = parts.filter(Boolean).join(" · ") || "Waiting for frames";
}

function onHoldmap(hm) {
  S.holdmap = hm;
  S.overlayDirty = true;
  showProblem(hm?.problem_id);
  $("holds-mode").hidden = hm?.mode !== "colour";
  const c = String(hm?.colour || "").toLowerCase();
  const swatch = c.startsWith("#") || CLASHING_HOLD_COLOURS.has(c) ? null : HOLD_COLOURS[c];
  const root = document.documentElement.style;
  if (swatch) {
    root.setProperty("--hold", swatch);
    root.setProperty("--hold-ink", luminance(swatch) > 0.55 ? "#16181b" : "#ffffff");
  } else {
    root.removeProperty("--hold"); root.removeProperty("--hold-ink");
  }
  renderLadder();
  S.headDirty = true;
}

function luminance(hex) {
  const n = parseInt(hex.slice(1), 16);
  if (Number.isNaN(n) || hex.length !== 7) return 0;
  return (0.299 * (n >> 16) + 0.587 * ((n >> 8) & 255) + 0.114 * (n & 255)) / 255;
}

function onState(st) {
  S.state = st;
  S.overlayDirty = true;
  renderClip(st?.frame_idx);
  const ids = Object.values(normLimbs(st?.contacts)).filter((id) => id != null);
  const live = st?.person_found !== false && ids.length ? Math.max(...ids) : null;
  if (live !== S.liveHold) { S.liveHold = live; renderLadderMarks(); }
  if (S.attemptLive && live != null && (S.highHold == null || live > S.highHold)) { S.highHold = live; renderLadderMarks(); }
  S.headDirty = true;
}

function showProblem(id) {
  if (!id) return;
  $("problem").textContent = `Problem ${id}`;
  $("problem").hidden = false;
}

function setMood(m) {
  if (!m) return;
  const el = $("mood");
  el.hidden = m === "neutral";
  el.textContent = m[0].toUpperCase() + m.slice(1);
}

function onEvent(ev) {
  if (!ev) return;
  if (ev.kind === "attempt_start") {
    S.attemptNo = (S.attemptNo ?? 0) + 1;
    S.attemptStartT = ev.t ?? S.state?.t ?? null;
    S.attemptLive = true;
    S.highHold = null;
    S.curEvents = 0;
    S.curSpoken = 0;
    S.debriefing = false;
    addTimeline("attempt", `Attempt ${S.attemptNo} started`, "");
    renderLadderMarks();
  }
  S.curEvents++;
  S.headDirty = true;
  renderCurrent();
}

// A cue is identified by its capture time and kind (the same key the brain uses).
function cueKey(t, kind) { return `${t}|${kind}`; }

function onSuppressed(s) {
  if (!s) return;
  const ev = s.event || {};
  const key = cueKey(ev.t, ev.kind);
  if (S.spokenKeys.has(key)) return;  // it was said after all; "spoken" is the record
  const detail = describeEventData(ev.data);
  addTimeline("suppressed", `${ev.kind || "event"}${detail}`, s.reason || "?").dataset.key = key;
}

function describeEventData(d) {
  if (!d) return "";
  const parts = [];
  if (d.limb) parts.push(d.limb);
  if (d.hold_id != null) parts.push(`hold ${d.hold_id}`);
  if (d.dir) parts.push(d.dir);
  return parts.length ? ` (${parts.join(", ")})` : "";
}

function onSpoken(line) {
  if (!line) return;
  const ms = Math.round((line.t_audio_start - line.t_event) * 1000);
  const hasLat = Number.isFinite(ms);
  if (hasLat) {
    S.latencies.push(ms);
    if (S.latencies.length > LATENCY_WINDOW) S.latencies.shift();
  }
  S.curSpoken++;
  // voice.say() can return False (logged as "not said: late") and still play once synthesis
  // catches up. The SpokenLine is the record of what was said, so drop the earlier entry.
  const key = cueKey(line.t_event, line.kind);
  S.spokenKeys.add(key);
  if (S.spokenKeys.size > TIMELINE_MAX) S.spokenKeys.delete(S.spokenKeys.values().next().value);
  for (const li of $("timeline").querySelectorAll("li.suppressed")) if (li.dataset.key === key) li.remove();
  addTimeline("spoken", line.text, hasLat ? `${ms} ms` : line.kind || "");
  S.debriefing = false;
  setCaption(line.text, false, hasLat ? `${ms} ms` : "");
  renderLatency();
  renderCurrent();
}

function onDebrief(text) {
  if (!text) return;
  const t = text.trim();
  if (!S.debriefing) {
    S.debriefing = true;
    setCaption(t, true, "");
  } else {
    const el = $("cap-text");
    el.textContent += " " + t;
    setCaption(null, true, "");
  }
  addTimeline("debrief", t, "debrief");
}

function onAttempt(a) {
  if (!a) return;
  const no = a.attempt_no ?? S.attemptNo ?? S.attempts.length + 1;
  S.attemptNo = no;
  S.attemptLive = false;
  S.lastOutcome = a.outcome;
  S.attempts = S.attempts.filter((x) => x.no !== no);
  S.attempts.push({ no, outcome: a.outcome, high: a.high_hold_id, duration: a.duration_s, stalls: a.stalls || [] });
  S.freshAttempt = no;
  S.highHold = a.high_hold_id ?? S.highHold;
  renderAttempts();
  renderLadderMarks();
  const cls = a.outcome === "top" ? "attempt top" : "attempt";
  addTimeline(cls, `Attempt ${no}: ${outcomeWord(a.outcome).toLowerCase()}, high hold ${a.high_hold_id ?? "–"}`, "");
  S.headDirty = true;
  renderCurrent();
}

// ---- Rendering: running head ------------------------------------------------
function renderHead() {
  S.headDirty = false;
  const sep = `<span class="sep">·</span>`;
  const n = holdCount();
  const of = n ? ` of ${n}` : "";
  let html;
  if (S.mode === "video_test") {
    html = "Video stream test";
  } else if (S.attemptNo == null) {
    html = "Waiting for the first attempt";
  } else if (S.attemptLive) {
    const hold = S.liveHold ?? S.highHold;
    const holdTxt = hold != null ? `hold <span class="live-hold num">${hold}</span>${of}` : "on the floor";
    const el = S.state?.t != null && S.attemptStartT != null ? Math.max(0, S.state.t - S.attemptStartT) : null;
    html = `Attempt ${S.attemptNo}${sep}${holdTxt}${el != null ? sep + `<span class="num">${fmtTime(el)}</span>` : ""}`;
  } else {
    const last = S.attempts.find((x) => x.no === S.attemptNo);
    const verb = last?.outcome === "top" ? "topped" : last?.outcome === "downclimb" ? "down at" : "fell at";
    html = `Attempt ${S.attemptNo}${sep}${verb} <span class="num">${last?.high ?? "–"}</span>${of}`;
  }
  $("where").innerHTML = html;
}

function fmtTime(s) {
  const m = Math.floor(s / 60), r = Math.floor(s % 60);
  return `${m}:${String(r).padStart(2, "0")}`;
}

// ---- Rendering: hold ladder -------------------------------------------------
const MARK_FALL = `<svg viewBox="0 0 16 24"><path d="M4 21 L12 3"/></svg>`;
const MARK_TOP = `<svg viewBox="0 0 24 24"><path d="M3 13 L9 20 L21 4"/></svg>`;

// One pencil mark per attempt: a red tick for a send, a graphite slash otherwise, with the attempt number.
function markHtml(a, fresh = false) {
  const top = a.outcome === "top";
  return `<span class="mark${top ? " top" : ""}${fresh ? " fresh" : ""}" title="Attempt ${esc(a.no)}: ${esc(outcomeWord(a.outcome))}">` +
    `${top ? MARK_TOP : MARK_FALL}<span class="a">${esc(a.no)}</span></span>`;
}

function renderLadder() {
  const el = $("ladder");
  const holds = [...(S.holdmap?.holds || [])].sort((a, b) => b.id - a.id);
  el.style.setProperty("--n", Math.max(holds.length, 1));
  $("ladder-count").textContent = holds.length || "";
  el.innerHTML = holds.map((h) => {
    return `<div class="rung" data-id="${h.id}"><span class="n">${h.id}</span><span class="marks"></span></div>`;
  }).join("");
  fitLadder();
  renderLadderMarks();
}

// Numbers scale with the rung height so 20 holds still fit.
function fitLadder() {
  const el = $("ladder");
  const rung = el.querySelector(".rung");
  if (!rung || matchMedia("(max-width: 900px)").matches) return;
  const h = rung.getBoundingClientRect().height;
  el.style.setProperty("--rung-fs", `${Math.max(14, Math.min(parseFloat(css("--m")) || 40, h * 0.66))}px`);
}

function renderLadderMarks() {
  for (const rung of document.querySelectorAll(".rung")) {
    const id = +rung.dataset.id;
    rung.classList.toggle("now", S.attemptLive && id === S.liveHold);
    rung.classList.toggle("high", S.attemptLive && id === S.highHold);
    const marks = S.attempts.filter((a) => a.high === id).map((a) => markHtml(a, a.no === S.freshAttempt));
    rung.querySelector(".marks").innerHTML = marks.join("");
  }
  S.freshAttempt = null;
}

// ---- Rendering: side column -------------------------------------------------
function renderAttempts() {
  const newest = [...S.attempts].sort((a, b) => b.no - a.no);
  const n = holdCount();
  // The attempt in progress is an open entry at the top, with this attempt's counts.
  const live = S.attemptLive ? `<div class="att live" title="Attempt ${esc(S.attemptNo)}, in progress">
      <div class="row"><span class="mark"><span class="a">${esc(S.attemptNo)}</span></span><span class="o">Climbing</span></div>
      <div class="d"><b>${S.curEvents}</b> events · <b>${S.curSpoken}</b> spoken</div></div>` : "";
  const shown = newest.slice(0, S.attemptLive ? ATTEMPT_CELLS - 1 : ATTEMPT_CELLS);
  $("attempts").innerHTML = live + shown.map((a) => {
    const k = (a.stalls || []).length;
    const stalls = k ? `${k} stall${k > 1 ? "s" : ""}` : "no stalls";
    const dur = a.duration != null ? `${Number(a.duration).toFixed(1)} s · ` : "";
    return `<div class="att ${esc(a.outcome || "")}" title="Attempt ${esc(a.no)}">
      <div class="row">${markHtml(a)}<span class="o">${esc(outcomeWord(a.outcome))}</span></div>
      <div class="d">hold <span class="num">${a.high ?? "–"}${n ? "/" + n : ""}</span> · ${dur}${stalls}</div></div>`;
  }).join("");
  const more = newest.length - shown.length;
  $("attempts-more").hidden = more <= 0;
  $("attempts-more").textContent = `${more} earlier, ticked on the ladder`;
}

function addTimeline(cls, text, meta) {

function renderLatency() {
  const l = S.latencies;
  if (!l.length) return;
  const last = l[l.length - 1];
  const sorted = [...l].sort((a, b) => a - b);
  const mid = sorted.length >> 1;
  const median = Math.round(sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2);
  const lateCount = l.filter((ms) => ms > LATENCY_WARN_MS).length;
  const el = $("lat-last");
  el.innerHTML = `${last}<small>ms</small>`;
  el.classList.toggle("late", last > LATENCY_WARN_MS);
  $("lat-sub").innerHTML = `median <b class="num">${median}</b> ms<br><span class="num">${l.length}</span> cues · ` +
    (lateCount ? `<b class="num">${lateCount}</b> over target` : "all on target");
  renderLatencyHistory();
}

function renderLatencyHistory() {
  const svg = $("lat-hist");
  const vals = S.latencies.slice(-LATENCY_HIST);
  const max = Math.max(LATENCY_WARN_MS * 1.5, ...vals);
  const W = 100, H = 40, bw = W / LATENCY_HIST;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const bars = vals.map((ms, i) => {
    const h = Math.max(1, (ms / max) * H);
    const x = (LATENCY_HIST - vals.length + i) * bw;
    return `<rect class="bar${ms > LATENCY_WARN_MS ? " late" : ""}" x="${x + bw * 0.18}" y="${H - h}" width="${bw * 0.64}" height="${h}"/>`;
  }).join("");
  const ty = H - (LATENCY_WARN_MS / max) * H;
  svg.innerHTML = bars + `<line class="target" x1="0" x2="${W}" y1="${ty}" y2="${ty}" vector-effect="non-scaling-stroke"/>`;
}

// Only shown when something is wrong; while connected, the mode flag says what's running.
function setConn(kind, label) {

// ---- Rendering: overlay -----------------------------------------------------
const canvas = $("overlay");
const ctx = canvas.getContext("2d");
const video = $("video");

// #frame is fitted to the video's aspect ratio, so the image fills the canvas exactly.
function contentRect() {
  return { x: 0, y: 0, w: canvas.width, h: canvas.height };
}

// Size of the picture: the current frame, else what hello or the hold map says, else 16:9.
function pictureSize() {
  if (video.naturalWidth && video.naturalHeight) return [video.naturalWidth, video.naturalHeight];
  if (S.source?.width && S.source?.height) return [S.source.width, S.source.height];
  const [w, h] = S.holdmap?.image_size || [];
  return w && h ? [w, h] : [16, 9];
}

// Largest box with the video's aspect ratio that fits in #stage. A portrait picture runs the full
// height and the stage column is only as wide as the picture, so the rest goes to the data.
function fitFrame() {
  const stage = $("stage"), frameEl = $("frame");
  const [iw, ih] = pictureSize();
  const narrow = matchMedia("(max-width: 900px)").matches;
  const portrait = ih > iw && !narrow && S.mode !== "video_test";
  if (document.body.classList.contains("portrait") !== portrait) {
    document.body.classList.toggle("portrait", portrait);
    S.overlayDirty = true;
  }
  const cs = getComputedStyle(stage);
  const padX = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight);
  const padY = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
  let sw, sh;
  if (narrow) {
    sw = stage.clientWidth - padX;
    sh = window.innerHeight * NARROW_MAX_VH;
  } else if (portrait) {
    // As wide as the height allows, leaving the ladder and the side column their minimum widths.
    const room = document.body.clientWidth - $("ladder-col").offsetWidth - parseFloat(getComputedStyle($("side")).minWidth);
    sw = room - padX;
    sh = stage.clientHeight - padY;
  } else {
    sw = stage.clientWidth - padX;
    sh = stage.clientHeight - padY;
  }
  if (sw <= 0 || sh <= 0) return;
  const scale = Math.min(sw / iw, sh / ih);
  const w = `${Math.floor(iw * scale)}px`, h = `${Math.floor(ih * scale)}px`;
  if (frameEl.style.width !== w || frameEl.style.height !== h) {
    frameEl.style.width = w;
    frameEl.style.height = h;
    S.overlayDirty = true;
    alignLadder();
  }
}

// The ladder fills its own column; only its numbers need resizing when the layout changes.
function alignLadder() { fitLadder(); }

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const r = canvas.getBoundingClientRect();
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; S.overlayDirty = true; }
}

function normLimbs(obj) {
  const out = {};
  for (const [k, v] of Object.entries(obj || {})) if (LIMB_ALIASES[k]) out[LIMB_ALIASES[k]] = v;
  return out;
}

const OVERLAY_FONT = '"Atkinson Hyperlegible Next", system-ui, sans-serif';

function drawOverlay() {
  resizeCanvas();
  const dpr = window.devicePixelRatio || 1;
  const R = contentRect();
  const P = ([x, y]) => [R.x + x * R.w, R.y + y * R.h];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // Labels scale with the picture so they stay readable at a distance.
  const u = Math.max(0.65, Math.min(1.6, Math.max(R.w, R.h) / (900 * dpr))) * dpr;

  const st = S.state && S.state.person_found !== false ? S.state : null;
  const contacts = normLimbs(st?.contacts);
  const limbs = normLimbs(st?.limbs);
  const heldBy = {};  // hold id -> [limb]
  for (const [limb, id] of Object.entries(contacts)) if (id != null) (heldBy[id] ||= []).push(limb);

  // Holds: white outlines, numbered; a held hold takes its limb's colour.
  const holds = S.holdmap?.holds || [];
  const byId = {};
  const placed = [];
  const hits = (r) => placed.some((q) => r.x0 < q.x1 && r.x1 > q.x0 && r.y0 < q.y1 && r.y1 > q.y0);
  ctx.textBaseline = "middle";
  ctx.textAlign = "center";
  for (const h of holds) {
    byId[h.id] = h;
    const [x0, y0] = P([h.bbox[0], h.bbox[1]]);
    const [x1, y1] = P([h.bbox[2], h.bbox[3]]);
    const users = heldBy[h.id];
    if (users) {
      ctx.fillStyle = LIMB_COLOURS[users[0]] + "55";
      ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
    }
    ctx.lineWidth = (users ? 4 : h.role === "mid" ? 2 : 3) * u;
    ctx.strokeStyle = users ? LIMB_COLOURS[users[0]] : "rgba(255,255,255,0.8)";
    ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);

    const label = h.role === "start" ? `${h.id} START` : h.role === "top" ? `${h.id} TOP` : `${h.id}`;
    ctx.font = `700 ${17 * u}px ${OVERLAY_FONT}`;
    const tw = ctx.measureText(label).width + 12 * u, th = 24 * u;
    const lx = (x0 + x1) / 2;
    let ly = Math.max(th / 2, y0 - th / 2 - 3 * u);
    const box = (y) => ({ x0: lx - tw / 2, x1: lx + tw / 2, y0: y - th / 2, y1: y + th / 2 });
    if (hits(box(ly))) ly = y1 + th / 2 + 3 * u;   // try below the hold instead
    placed.push(box(ly));
    ctx.fillStyle = h.role === "mid" ? "rgba(17,19,21,0.78)" : "#ffffff";
    ctx.fillRect(lx - tw / 2, ly - th / 2, tw, th);
    ctx.fillStyle = h.role === "mid" ? "#ffffff" : "#111315";
    ctx.fillText(label, lx, ly + 1 * u);
  }

  if (!st) return;

  // Skeleton
  const kp = {};
  for (const [k, v] of Object.entries(st.keypoints || {})) kp[/^\d+$/.test(k) ? MP_NAMES[+k] : k] = v;
  const vis = (p) => p && (p[2] == null || p[2] >= MIN_VISIBILITY);
  ctx.lineCap = "round";
  ctx.lineWidth = 4 * u;
  ctx.strokeStyle = "rgba(255,255,255,0.88)";
  for (const [a, b] of BONES) {
    if (!vis(kp[a]) || !vis(kp[b])) continue;
    const [ax, ay] = P(kp[a]), [bx, by] = P(kp[b]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
  }
  ctx.fillStyle = "rgba(255,255,255,0.92)";
  for (const p of Object.values(kp)) {
    if (!vis(p)) continue;
    const [x, y] = P(p);
    ctx.beginPath(); ctx.arc(x, y, 3 * u, 0, Math.PI * 2); ctx.fill();
  }
  if (st.hip) {
    const [x, y] = P(st.hip);
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3 * u;
    ctx.beginPath(); ctx.arc(x, y, 10 * u, 0, Math.PI * 2); ctx.stroke();
  }

  // Limb points, with a line to the hold they're on
  for (const [limb, pt] of Object.entries(limbs)) {
    if (!pt) continue;
    const [x, y] = P(pt);
    const colour = LIMB_COLOURS[limb];
    const hold = byId[contacts[limb]];
    if (hold) {
      const [hx, hy] = P(hold.center);
      ctx.strokeStyle = colour; ctx.lineWidth = 2 * u; ctx.setLineDash([6 * u, 4 * u]);
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.setLineDash([]);
    }
    ctx.fillStyle = colour; ctx.strokeStyle = "#111315"; ctx.lineWidth = 2 * u;
    ctx.beginPath(); ctx.arc(x, y, (hold ? 13 : 10) * u, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#111315"; ctx.font = `800 ${11 * u}px ${OVERLAY_FONT}`;
    ctx.fillText(limb, x, y + 0.5 * u);
  }
}

let stageKey = "";
function frame() {
  fitFrame();
  const r = $("stage").getBoundingClientRect(), f = $("frame").getBoundingClientRect();
  const key = `${r.top}|${r.height}|${f.top}|${f.height}`;
  if (key !== stageKey) { stageKey = key; alignLadder(); }
  if (S.overlayDirty) { S.overlayDirty = false; drawOverlay(); }
  requestAnimationFrame(frame);
}
setInterval(() => { if (S.headDirty) renderHead(); }, HEAD_PAINT_MS);
new ResizeObserver(() => { S.overlayDirty = true; fitLadder(); }).observe(document.body);

// ---- Video ------------------------------------------------------------------
// Two ways in: an MJPEG stream at /video, or JPEG frames over the WebSocket (binary
// messages, or {"topic": "frame", "data": "<base64 jpeg>"}). The first WebSocket frame
// switches the page over to WebSocket video for the rest of the connection.
let wsVideo = false;
let frameUrl = null;

function loadVideo() {
  if (wsVideo || VIDEO_URL === "ws") return;
  video.src = `${VIDEO_URL}${VIDEO_URL.includes("?") ? "&" : "?"}t=${Date.now()}`;
}

function showFrame(blob) {
  wsVideo = true;
  const st = S.stream;
  st.arrivals.push(performance.now());
  st.bytes.push(blob.size);
  if (st.arrivals.length > STREAM_WINDOW) { st.arrivals.shift(); st.bytes.shift(); }
  const old = frameUrl;
  frameUrl = URL.createObjectURL(blob);
  video.src = frameUrl;
  if (old) URL.revokeObjectURL(old);
}

function showBase64Frame(b64) {
  if (typeof b64 !== "string") return;
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  showFrame(new Blob([bytes], { type: "image/jpeg" }));
}

video.addEventListener("load", () => { $("novideo").hidden = true; S.overlayDirty = true; });
video.addEventListener("error", () => { if (!wsVideo) $("novideo").hidden = false; });

// ---- Source picker ------------------------------------------------------------
// Lists what the server can analyse; picking one asks the server to switch. The new "hello"
// that follows (to every open dashboard) is what actually updates the page.
const SRC = { current: null, switching: false };

async function loadSources() {
  try {
    const r = await fetch(`${HTTP_BASE}/api/sources`);
    if (!r.ok) throw new Error(r.statusText);
    renderPicker(await r.json());
  } catch {
    $("src-pick").hidden = true;  // this server can't switch (replay, stream test)
    renderSrcbar();
  }
}

function renderPicker({ current, options }) {
  const groups = new Map();
  for (const o of options || []) {
    if (!groups.has(o.group)) groups.set(o.group, []);
    groups.get(o.group).push(o);
  }
  $("source").innerHTML = [...groups].map(([g, opts]) => `<optgroup label="${esc(g)}">` +
    opts.map((o) => `<option value="${esc(o.spec)}" title="${esc(o.spec)}">${esc(o.name)}</option>`).join("") +
    `</optgroup>`).join("");
  $("src-pick").hidden = !(options || []).length;
  setCurrentSource(current ?? SRC.current);
  if (!$("clip-label").hidden && S.mode) setMode(S.mode, S.source);  // the name moves into the picker
  renderSrcbar();
}

function setCurrentSource(spec) {
  if (!spec) return;
  SRC.current = spec;
  if (!SRC.switching) $("source").value = spec;
}

function renderSrcbar() {
  const bar = $("srcbar");
  const hidden = $("src-pick").hidden && $("clip-label").hidden && $("src-note").hidden;
  if (bar.hidden !== hidden) { bar.hidden = hidden; S.overlayDirty = true; }
}

function srcNote(text, isError = false) {
  const el = $("src-note");
  el.hidden = !text;
  el.textContent = text || "";
  el.classList.toggle("err", isError);
  renderSrcbar();
}

async function pickSource(spec) {
  const prev = SRC.current;
  if (spec === BROWSER_SPEC && !(await startCamera())) { $("source").value = prev ?? ""; return; }
  SRC.switching = true;
  $("source").disabled = true;
  srcNote("Switching…");
  try {
    const r = await fetch(`${HTTP_BASE}/api/source`, { method: "POST",
      headers: { "content-type": "application/json" }, body: JSON.stringify({ spec }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    const { hello } = await r.json();
    srcNote(null);
    if (hello) onHello(hello);  // normally the WebSocket brings it first; this covers a slow socket
  } catch (err) {
    srcNote(`Couldn't switch: ${err.message}`, true);
    if (spec === BROWSER_SPEC) stopCamera();
    $("source").value = prev ?? "";
  } finally {
    SRC.switching = false;
    $("source").disabled = false;
    setCurrentSource(SRC.current);
  }
}
$("source").addEventListener("change", (e) => pickSource(e.target.value));

// ---- This device's camera -------------------------------------------------------
// Webcam frames go to the server as JPEGs over WS /camera. The server runs perception on
// them and sends its frames back like any other source, so the overlay matches what it saw.
const CAM = { stream: null, el: null, canvas: null, ws: null, timer: null, encoding: false, wanted: false };

async function startCamera() {
  if (CAM.stream) return true;
  if (!navigator.mediaDevices?.getUserMedia) {
    srcNote("The camera only works over https or on localhost", true);
    return false;
  }
  try {
    CAM.stream = await navigator.mediaDevices.getUserMedia({ audio: false,
      video: { width: { ideal: 1280 }, height: { ideal: 720 } } });
  } catch (err) {
    srcNote(err.name === "NotAllowedError" ? "Camera permission was denied" : `No camera: ${err.message}`, true);
    return false;
  }
  CAM.el = Object.assign(document.createElement("video"), { muted: true, playsInline: true, srcObject: CAM.stream });
  await CAM.el.play().catch(() => {});
  CAM.canvas = document.createElement("canvas");
  CAM.wanted = true;
  try { sessionStorage.setItem(CAMERA_KEY, "1"); } catch {}
  CAM.stream.getVideoTracks()[0]?.addEventListener("ended", () => { stopCamera(); srcNote("The camera stopped", true); });
  openCameraSocket();
  CAM.timer = setInterval(sendCameraFrame, 1000 / CAMERA_FPS);
  return true;
}

function openCameraSocket() {
  const ws = new WebSocket(CAMERA_URL);
  CAM.ws = ws;
  ws.onclose = (e) => {
    if (CAM.ws !== ws) return;
    CAM.ws = null;
    if (e.code === CAMERA_BUSY_CODE) {
      stopCamera();
      srcNote("Another dashboard is already sending its camera", true);
    } else if (CAM.wanted) {
      setTimeout(() => { if (CAM.wanted && !CAM.ws) openCameraSocket(); }, CAMERA_RETRY_MS);
    }
  };
}

function sendCameraFrame() {
  const ws = CAM.ws, v = CAM.el;
  if (!ws || ws.readyState !== WebSocket.OPEN || CAM.encoding || ws.bufferedAmount > CAMERA_MAX_BUFFER) return;
  if (!v?.videoWidth) return;
  const scale = Math.min(1, CAMERA_MAX_SIDE / Math.max(v.videoWidth, v.videoHeight));
  const c = CAM.canvas;
  c.width = Math.round(v.videoWidth * scale);
  c.height = Math.round(v.videoHeight * scale);
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
  CAM.encoding = true;
  c.toBlob((blob) => {
    CAM.encoding = false;
    if (blob && ws.readyState === WebSocket.OPEN) ws.send(blob);
  }, "image/jpeg", CAMERA_JPEG_QUALITY);
}

function stopCamera() {
  CAM.wanted = false;
  try { sessionStorage.removeItem(CAMERA_KEY); } catch {}
  clearInterval(CAM.timer);
  CAM.timer = null;
  CAM.stream?.getTracks().forEach((t) => t.stop());
  CAM.stream = null;
  if (CAM.el) CAM.el.srcObject = null;
  CAM.el = null;
  const ws = CAM.ws;
  CAM.ws = null;
  ws?.close();
}

// Keep sending only while the server is analysing the browser camera. After a reload, the
// tab that was sending picks it up again.
function syncCamera(hello) {
  if (hello.source?.kind !== "browser_camera") { if (CAM.stream) stopCamera(); return; }
  let resume = false;
  try { resume = sessionStorage.getItem(CAMERA_KEY) === "1"; } catch {}
  if (!CAM.stream && resume) startCamera();
}

// ---- WebSocket --------------------------------------------------------------
let backoff = 500;
function connect() {
  let ws;
  try { ws = new WebSocket(WS_URL); } catch (e) { return retry(); }
  ws.binaryType = "blob";
  ws.onopen = () => {
    backoff = 500;
    setConn("ok", "Connected");
    loadVideo();
    loadSources();
  };
  ws.onmessage = (e) => {
    if (e.data instanceof Blob) return showFrame(e.data.type ? e.data : new Blob([e.data], { type: "image/jpeg" }));
    try { handle(JSON.parse(e.data)); } catch (err) { console.warn("bad message", err, e.data); }
  };
  ws.onclose = () => {
    wsVideo = false;
    setConn("down", "Reconnecting…");
    retry();
  };
}
function retry() { setTimeout(connect, backoff); backoff = Math.min(backoff * 2, RECONNECT_MAX_MS); }

// ---- Demo mode (?demo=1): fake bus traffic, no server ------------------------
function runDemo() {
  setConn("ok", "Demo data");
  setMode("demo", null);
  const holds = [];
  const path = [[0.45, 0.88], [0.55, 0.86], [0.5, 0.74], [0.42, 0.63], [0.56, 0.55],
                [0.47, 0.44], [0.58, 0.34], [0.5, 0.24], [0.44, 0.14], [0.52, 0.06]];
  path.forEach(([x, y], i) => holds.push({ id: i + 1, center: [x, y],
    bbox: [x - 0.025, y - 0.02, x + 0.025, y + 0.02],
    role: i < 2 ? "start" : i === path.length - 1 ? "top" : "mid" }));
  handle({ topic: "hello", data: { no_llm: true, problem_id: "demo-pink" } });
  handle({ topic: "holdmap", data: { problem_id: "demo-pink", colour: "pink", holds,
    image_size: [1280, 720], mode: "colour" } });

  let t = 0, attempt = 0;
  const cues = [["feet_low", "Feet up, find hold 3."], ["hand_searching", "Left hand, up and left to hold 6."],
                ["arms_bent", "Straighten those arms."], ["stalling", "Commit. Go now."],
                ["quiet_feet", "Quiet feet, nice."]];
  const reasons = ["cooldown", "busy", "stale", "budget", "lower_priority", "late"];
  const startAttempt = () => {
    attempt++;
    handle({ topic: "event", data: { t, kind: "attempt_start", priority: 0, ttl_s: 1, data: {} } });
  };
  startAttempt();
  setInterval(() => {   // state at 10 Hz
    t += 0.1;
    const phase = (t % 30) / 30;
    const yoff = phase * 0.6;
    const sway = Math.sin(t * 1.5) * 0.03;
    const hipX = 0.5 + sway, hipY = 0.75 - yoff;
    const kp = {
      nose: [hipX, hipY - 0.27, 1],
      left_shoulder: [hipX - 0.05, hipY - 0.2, 1], right_shoulder: [hipX + 0.05, hipY - 0.2, 1],
      left_elbow: [hipX - 0.08, hipY - 0.27, 1], right_elbow: [hipX + 0.08, hipY - 0.24, 1],
      left_wrist: [hipX - 0.07, hipY - 0.34, 1], right_wrist: [hipX + 0.07, hipY - 0.31, 1],
      left_hip: [hipX - 0.03, hipY, 1], right_hip: [hipX + 0.03, hipY, 1],
      left_knee: [hipX - 0.08, hipY + 0.06, 1], right_knee: [hipX + 0.07, hipY + 0.07, 1],
      left_ankle: [hipX - 0.06, hipY + 0.13, 1], right_ankle: [hipX + 0.06, hipY + 0.12, 1],
    };
    const limbs = { left_hand: kp.left_wrist.slice(0, 2), right_hand: kp.right_wrist.slice(0, 2),
                    left_foot: kp.left_ankle.slice(0, 2), right_foot: kp.right_ankle.slice(0, 2) };
    const near = (p) => {
      let best = null, bd = 0.06;
      for (const h of holds) { const d = Math.hypot(h.center[0] - p[0], h.center[1] - p[1]); if (d < bd) { bd = d; best = h.id; } }
      return best;
    };
    const contacts = Object.fromEntries(Object.entries(limbs).map(([k, p]) => [k, near(p)]));
    handle({ topic: "state", data: { t, frame_idx: Math.round(t * 30), person_found: true,
      keypoints: kp, limbs, contacts, hip: [hipX, hipY] } });
  }, 100);
  setInterval(() => {   // events, every 2.5 s
    const [kind, text] = cues[Math.floor(Math.random() * cues.length)];
    const ev = { t, kind, priority: 1, ttl_s: 1.5, data: { limb: "LH", hold_id: 6 } };
    handle({ topic: "event", data: ev });
    if (Math.random() < 0.55) {
      handle({ topic: "spoken", data: { t_event: t, t_audio_start: t + 0.25 + Math.random() * 0.7, kind, text } });
    } else {
      handle({ topic: "suppressed", data: { event: ev, reason: reasons[Math.floor(Math.random() * reasons.length)] } });
    }
  }, 2500);
  setInterval(() => {   // attempt end + debrief, every 30 s
    const outcome = ["fall", "top", "downclimb"][attempt % 3];
    const high = { fall: 6, top: 10, downclimb: 8 }[outcome];
    handle({ topic: "attempt", data: { attempt_no: attempt, duration_s: 28.4, high_hold_id: high,
      outcome, stalls: [[5, 3.2], [7, 1.8]], cues_given: [], cues_followed: [] } });
    handle({ topic: "mood", data: outcome === "top" ? "impressed" : "exasperated" });
    ["Right, attempt " + attempt + ".", "You hung on hold 5 for three seconds.",
     "Feet higher before the reach to 6, and you'll stick it."]
      .forEach((s, i) => setTimeout(() => handle({ topic: "debrief_text", data: s }), 600 + i * 1200));
    setTimeout(startAttempt, 5000);
  }, 30000);
}

// ---- Start ------------------------------------------------------------------
$("hide-supp").addEventListener("change", (e) => $("timeline").classList.toggle("hide-suppressed", e.target.checked));
$("lat-target").textContent = LATENCY_WARN_MS;
if (params.has("offline")) $("offline").hidden = false;
renderCurrent();
renderLadder();
requestAnimationFrame(frame);
setInterval(renderStreamStats, 1000);
if (DEMO) runDemo(); else connect();
</script>
